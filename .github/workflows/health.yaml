name: Health
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  health:
    uses: dart-lang/ecosystem/.github/workflows/health.yaml@f8faabf263f94a7a8508c5e57f1ff3752fa23915
    with:
      ignore_coverage: "**.mock.dart,**.g.dart"
      ignore_license: "**.mock.dart,**.g.dart,**.mocks.dart,pkgs/platform/*"
      sdk: beta
    permissions:
      pull-requests: write
