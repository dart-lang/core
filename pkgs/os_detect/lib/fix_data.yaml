# Data-driven fixes for `package:os_detect`.
#
# This file migrates users of the deprecated `package:os_detect/os_detect.dart`
# APIs to `package:platform` version 3.2 or later.
#
# Applied automatically by `dart fix --apply`, and offered as quick fixes
# in IDEs.
#
# Format documentation:
# https://github.com/flutter/flutter/blob/master/docs/contributing/Data-driven-Fixes.md
#
# Tests live in `test_fixes/`, run them with:
#     dart fix --compare-to-golden test_fixes

version: 1
transforms:
  # ---------------------------------------------------------------------------
  # Deprecated in os_detect 2.1.0 in favor of `package:platform` >= 3.2.
  # ---------------------------------------------------------------------------

  # `operatingSystem` -> `NativePlatform.current!.operatingSystem`
  #
  # The `!` is needed because `NativePlatform.current` is `null` when not
  # running on a native platform (for example in a browser). Code that used
  # `os_detect` in a browser should check `Platform.current.isBrowser` first.
  - title: "Use NativePlatform.current!.operatingSystem"
    date: 2026-09-14
    element:
      uris: ["package:os_detect/os_detect.dart"]
      getter: "operatingSystem"
    changes:
      - kind: "replacedBy"
        newElement:
          uris: ["package:platform/platform.dart"]
          getter: "current!.operatingSystem"
          inClass: "NativePlatform"
          static: true

  # `operatingSystemVersion` -> `NativePlatform.current!.operatingSystemVersion`
  - title: "Use NativePlatform.current!.operatingSystemVersion"
    date: 2026-09-14
    element:
      uris: ["package:os_detect/os_detect.dart"]
